# Publishes the live dashboard (multipilot/web) to GitHub Pages, served at
# https://c5mk.fpvgate.xyz (the custom domain is set in the repo's Pages
# settings; DNS: a CNAME record c5mk -> louishitchcock.github.io).
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "multipilot/web/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: multipilot/web
      - id: deploy
        uses: actions/deploy-pages@v4
