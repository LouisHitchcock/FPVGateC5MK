; Minimal ESP32-S3 host for a C5MK receiver: the starting point for your own
; timer firmware. See docs/HOST_IMPLEMENTATION.md.
;
;   pio run -t upload --upload-port <port>
;   pio device monitor -b 115200
;
; Wiring (XIAO ESP32-S3 to a C5-Zero): D3/GPIO4 -> C5 GPIO4, D4/GPIO5 <- C5
; GPIO5, 3V3, GND.

[platformio]
src_dir = src

[env:xiao_esp32s3]
platform = espressif32@6.9.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
; The library is ../../c5host.
lib_extra_dirs = ../..
lib_deps = c5host
