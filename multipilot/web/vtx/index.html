<!DOCTYPE html>
<!-- VTX check: which channel a quad's video transmitter is on, whether it's on
     the right frequency, and its power compared with a known 25 mW reference.
     A C5MK receiver on USB; the work happens in the page (vtxscan.js).
     Published at https://c5mk.fpvgate.xyz/vtx/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>VTX Check | FPVGate C5MK</title>
<meta name="description" content="Find which channel a quad's video transmitter is on, and check its power against a 25 mW reference, with a C5MK receiver.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #111317; --panel: #191c21; --panel2: #1f232a; --line: #2a2f37; --line2: #353b45;
    --text: #eef0f3; --soft: #bfc5ce; --muted: #8a919c; --accent: #3987e5; --accent-dim: #1d3a5c;
    --ok: #3dbb7c; --warn: #d9a33a; --bad: #e05d5d;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: var(--text); cursor: pointer; border: 1px solid var(--line2); background: var(--panel2); border-radius: 12px; padding: 10px 16px; min-height: 48px; }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .45; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.big { width: 100%; font-size: 19px; min-height: 60px; border-radius: 16px; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top)); background: rgba(17,19,23,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .title small { font-weight: 500; color: var(--muted); margin-left: 6px; }
  header .spacer { flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555c66; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,187,124,.18); }
  .dot.busy { background: var(--warn); }
  #connText { color: var(--muted); font-size: 14px; white-space: nowrap; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
  main > *, .card { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  h1 { font-size: 28px; margin: 4px 0 6px; line-height: 1.15; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  p { margin: 0; color: var(--soft); }
  .muted { color: var(--muted); font-size: 14px; }
  .notice { border-radius: 12px; padding: 12px 14px; font-size: 15px; background: #2a2316; border: 1px solid #5a4823; color: #f1d9a3; }
  .notice.err { background: #2c1717; border-color: #6a2a2a; color: #f4b9b9; }
  .notice:empty { display: none; }
  [hidden] { display: none !important; }
  @media (max-width: 440px) { header .title small { display: none; } }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 16px 24px; }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<header>
  <svg width="44" height="18" viewBox="0 0 585 240" fill="none" aria-hidden="true"><path d="M 34 137 H 94 C 123 137 128 96 157 96 C 194 96 196 204 231 204 C 264 204 284 34 317 34 C 351 34 357 183 384 183 C 409 183 413 115 439 115 C 457 115 467 137 489 137 H 551" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="title">VTX Check<small>FPVGate C5MK</small></span>
  <span class="spacer"></span>
  <span class="dot" id="dot"></span><span id="connText">Not connected</span>
</header>

<main>
  <div class="notice" id="notice"></div>

  <section class="card" id="cardConnect">
    <h1>Which channel is my quad on?</h1>
    <p>Plug in a C5MK receiver, power up the quad nearby, and this page finds its video channel, checks it's on the right
      frequency, and compares its power with a 25 mW reference.</p>
    <button class="primary big" id="btnConnect" style="margin-top:16px">Connect receiver</button>
    <div class="notice err" id="noUsb" hidden style="margin-top:12px"></div>
  </section>

  <section id="vtxPanel" hidden></section>
</main>

<footer>
  <a href="../">Live signal view</a> · <a href="../timer/">Lap timer</a> · <a href="https://fpvgate.xyz" target="_blank" rel="noopener">fpvgate.xyz</a>
</footer>

<script type="module">
import { C5Link, whyNoTransport } from "../c5mk-link.js";
import { mountVtxCheck } from "../vtxpanel.js";

const $ = id => document.getElementById(id);
const link = new C5Link();
mountVtxCheck($("vtxPanel"), link);

function notice(text, err) {
  $("notice").textContent = text || "";
  $("notice").className = "notice" + (err ? " err" : "");
}

link.addEventListener("state", e => {
  const { connected, text } = e.detail;
  $("dot").className = "dot" + (connected ? " ok" : /Connecting/.test(text) ? " busy" : "");
  $("connText").textContent = connected ? "Connected" : /Connecting/.test(text) ? "Connecting…" : "Not connected";
  $("cardConnect").hidden = connected;
  $("vtxPanel").hidden = !connected;
  if (connected) { notice(""); link.send("scan on"); }
  else if (!/Connecting|Not connected/.test(text)) notice(text, true);
});
$("btnConnect").onclick = () => link.connect();

if (!link.kind) {
  $("noUsb").textContent = whyNoTransport();
  $("noUsb").hidden = false;
  $("btnConnect").disabled = true;
} else {
  link.watch();
  link.autoConnect();
}
</script>
</body>
</html>
