; FPVGate C5MK multi-pilot RSSI firmware (ESP-IDF build).
;
; Build and flash (on Windows use PowerShell or cmd; Git Bash's MSYS
; environment breaks PlatformIO's esptool install):
;   pio run -e c5zero -t upload --upload-port <port>
;   pio run -e xiaoc5 -t upload --upload-port <port>
;
; Host tools: tools/mp.py (console, recorder, capture analysis) and
; web/index.html (live view, Web Serial).

[platformio]
src_dir = src
; Optional machine-local settings (gitignored).
extra_configs = platformio_local*.ini

[env:c5zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
board = esp32-c5-devkitc-1
monitor_speed = 115200
extra_scripts = post:check_sram.py

; Seeed Studio XIAO ESP32-C5. Its header has no GPIO4/5, so the FPVGate link
; moves to D4/D5 (GPIO23/24), which are neither strapping nor console pins:
;   XIAO S3 D3 / GPIO4 (TX) -> XIAO C5 D4 / GPIO23 (RX)
;   XIAO S3 D4 / GPIO5 (RX) <- XIAO C5 D5 / GPIO24 (TX)
; Pin map: arduino-esp32 variants/XIAO_ESP32C5/pins_arduino.h. The generic
; C5 DevKitC board definition fits: only the link pins differ. The pins go to
; CMake (src/CMakeLists.txt): build_flags don't reach the ESP-IDF sources.
[env:xiaoc5]
extends = env:c5zero
board_build.cmake_extra_args =
    -DNODE_UART_RX_PIN=23
    -DNODE_UART_TX_PIN=24
